version: 1
# AWS Amplify build spec for the ANGULAR Storybook (packages/angular).
# Paste into: Amplify console > the Angular app > Hosting > Build settings > Edit.
# It is deliberately NOT named amplify.yml: the React Storybook already deploys
# from this repo/branch as its own Amplify app, and a root amplify.yml would
# replace that app's build settings too.
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - nvm use 22
        - node -v
        - npm ci
    build:
      commands:
        # build:tokens -> build:styles -> ng-packagr library -> static Storybook
        - npm run build-storybook:angular
  artifacts:
    baseDirectory: storybook-static-angular
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
customHeaders:
  - pattern: '**/*'
    headers:
      - key: 'X-Frame-Options'
        value: 'SAMEORIGIN'
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
